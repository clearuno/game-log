<html lang="ko">
<head>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Royal Road 스토리 로그</title>

<style>
:root{
  --ground:#EEF0F4; --surface:#FFFFFF; --sunk:#E4E7EE;
  --ink:#171A22; --muted:#5B6173; --faint:#8A90A0; --line:#D9DDE6;
  --todo:#D3D7E0;
  --violet:#6A47F0; --orange:#D9621A; --green:#2F8F3A; --rose:#CF3467; --blue:#1C72D6; --teal:#138A86; --amber:#B7791F;
  --warn:#A15C00;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101217; --surface:#181B22; --sunk:#20242D;
    --ink:#E8EAF0; --muted:#A0A6B6; --faint:#6F7586; --line:#2A2E38;
    --todo:#2E333E;
    --violet:#A08DFF; --orange:#FF9550; --green:#6FD07A; --rose:#FF7CA5; --blue:#6AB0FF; --teal:#4FD1CB; --amber:#F2B455;
    --warn:#F2B455;
  }
}
:root[data-theme="dark"]{
  --ground:#101217; --surface:#181B22; --sunk:#20242D;
  --ink:#E8EAF0; --muted:#A0A6B6; --faint:#6F7586; --line:#2A2E38;
  --todo:#2E333E;
  --violet:#A08DFF; --orange:#FF9550; --green:#6FD07A; --rose:#FF7CA5; --blue:#6AB0FF; --teal:#4FD1CB; --amber:#F2B455;
  --warn:#F2B455;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:32px 64px;display:grid;gap:28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc,var(--blue));outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 헤더 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:0 0 4px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.sum{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0}
.sum div{display:grid}
.sum dt{font-size:12px;color:var(--muted)}
.sum dd{margin:0;font-family:var(--display);font-size:26px;line-height:1.1}
.sum dd small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:2px}

/* 게임 선택 카드 */
.games{display:grid;gap:10px;grid-template-columns:repeat(5,minmax(0,1fr))}
.game{--acc:var(--blue);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;cursor:pointer;display:grid;gap:8px;align-content:start;transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--acc)}
.game[aria-selected="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.game-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.game-name{font-weight:600;font-size:15px}
.game-pct{font-family:var(--display);font-size:30px;line-height:1;color:var(--acc)}
.game-pct small{font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--todo);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.game-meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.game-next{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-next b{font-weight:500;color:var(--ink)}

/* 상세 패널 */
.detail{--acc:var(--blue);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:20px}
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.d-head h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0}
.d-file{font-size:12px;color:var(--faint);margin-top:6px}
.d-stats{display:flex;gap:24px;flex-wrap:wrap}
.d-stats div{display:grid}
.d-stats dt{font-size:12px;color:var(--muted)}
.d-stats dd{margin:0;font-family:var(--display);font-size:24px;line-height:1.1}
.d-stats dd.acc{color:var(--acc)}

.strip-box{display:grid;gap:6px}
.strip{display:flex;gap:2px;height:30px;align-items:stretch}
.seg{flex-basis:0;min-width:3px;background:var(--todo);border-radius:2px;cursor:pointer;border:0;padding:0}
.seg.done{background:var(--acc)}
.seg.next{background:repeating-linear-gradient(135deg,var(--acc) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--acc)}
.seg:hover{filter:brightness(1.15);transform:scaleY(1.12)}
.strip-legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}
.strip-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--todo)}
.sw.done{background:var(--acc)}
.sw.next{background:repeating-linear-gradient(135deg,var(--acc) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--acc)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.src summary{font-size:13px;color:var(--muted);cursor:pointer}
.src ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:4px;max-width:70ch}
.src a{color:var(--acc)}

.list{display:grid;gap:0}
.group-h{font-size:12px;letter-spacing:.06em;color:var(--muted);padding:16px 0 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.group-h:first-child{padding-top:0}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--acc) 22%,transparent)}100%{background:transparent}}
.box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--faint);margin-top:2px;display:grid;place-items:center}
.row.done .box{background:var(--acc);border-color:var(--acc)}
.box svg{width:12px;height:12px;fill:none;stroke:var(--surface);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.r-title{min-width:0}
.row.done .r-title .t{color:var(--muted)}
.t{overflow-wrap:anywhere}
.r-sub{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:18px}
.tag.req{border-color:var(--acc);color:var(--acc)}
.stars{color:var(--acc);letter-spacing:1px}
.stars .off{color:var(--todo)}
.warn{color:var(--warn)}
.next-badge{background:var(--acc);color:var(--surface);border-radius:4px;padding:0 6px;line-height:18px;font-weight:600}
.review{grid-column:2/4;margin:4px 0 0;padding:8px 12px;border-left:2px solid var(--acc);background:var(--sunk);border-radius:0 6px 6px 0;font-size:13px;color:var(--ink);white-space:pre-wrap}
.r-min{font-size:13px;color:var(--muted);text-align:right;padding-top:2px}
.r-min.zero{color:var(--warn)}
.empty{color:var(--muted);font-size:14px;padding:20px 0}

/* 백로그 */
.backlog h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 10px}
.bl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.bl li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.bl li.done{color:var(--faint);text-decoration:line-through}
.bl .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--faint)}
.bl li.done .dot{background:var(--faint)}
footer{font-size:12px;color:var(--faint)}

@media (max-width:960px){
  .games{grid-template-columns:minmax(0,1fr)}
  .game{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 16px}
  .game .game-head{grid-column:1/-1}
  .game .bar{grid-column:1/-1}
}
@media (max-width:560px){
  .detail{padding:16px}
  .row{grid-template-columns:20px minmax(0,1fr) auto;gap:2px 10px}
  .review{grid-column:1/-1}
  .strip{height:24px;gap:1px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <div class="game-meta"><span class="num">${g.done.toLocaleString()} / ${g.total.toLocaleString()}분</span></div>
    </button>`;
  }).join("");
}

function itemRow(g, it, i, n){
  const stars = it.stars != null
    ? `<span class="stars" title="스토리 중요도 ${it.stars}/5">${"★".repeat(it.stars)}<span class="off">${"★".repeat(5 - it.stars)}</span></span>` : "";
  const tags = (it.tags || []).map(t => `<span class="tag${t.includes("필수") ? " req" : ""}">${esc(t)}</span>`).join("");
  const notes = (it.notes || []).map(t => `<span class="${/확인|⚠️/.test(t) ? "warn" : ""}">${esc(t)}</span>`).join("");
  const zero = it.min === 0 && g.items.some(x => x.min > 0);
  const sub = [i === n ? '<span class="next-badge">다음 차례</span>' : "", stars, tags, notes,
    zero ? '<span class="warn">분량 미확인</span>' : "",
    it.review === "" ? '<span>감상 노트 (비어 있음)</span>' : ""].join("");
  return `<div class="row${it.done ? " done" : ""}" id="item-${i}">
    <span class="box" role="img" aria-label="${it.done ? "감상함" : "안 봄"}">${it.done ? CHECK : ""}</span>
    <div class="r-title"><div class="t">${esc(it.title)}</div>${sub ? `<div class="r-sub">${sub}</div>` : ""}</div>
    <span class="r-min num${zero ? " zero" : ""}">${it.min}분</span>
    ${it.review ? `<blockquote class="review">${esc(it.review)}</blockquote>` : ""}
  </div>`;
}

function renderDetail(){
  const g = games.find(x => x.id === current);
  const el = $("#detail");
  if (!g){ el.innerHTML = '<p class="empty">게임 트래커 노트를 찾지 못했어요.</p>'; return; }
  el.style.setProperty("--acc", `var(--${g.accent})`);
  const n = nextOf(g);
  const cnt = g.items.filter(i => i.done).length;

  const segs = g.items.map((it, i) => {
    const cls = it.done ? "done" : i === n ? "next" : "";
    return `<button class="seg ${cls}" style="flex-grow:${Math.max(it.min, 8)}" data-i="${i}"
      title="${esc(it.title)} · ${it.min}분${it.done ? " · 감상함" : ""}" aria-label="${esc(it.title)}"></button>`;
  }).join("");

  const shown = g.items.map((it, i) => [it, i]).filter(([it]) =>
    filter === "all" || (filter === "todo" ? !it.done : it.done));

  let list = "", lastGroup;
  for (const [it, i] of shown){
    const grp = it.group || "";
    if (grp !== lastGroup){
      if (grp){
        const gi = g.items.filter(x => (x.group || "") === grp);
        const gt = gi.reduce((a, x) => a + x.min, 0), gd = gi.filter(x => x.done).reduce((a, x) => a + x.min, 0);
        list += `<div class="group-h"><span>${esc(grp)}</span><span class="num">${gt ? Math.round(gd / gt * 100) : 0}%</span></div>`;
      }
      lastGroup = grp;
    }
    list += itemRow(g, it, i, n);
  }
  if (!shown.length) list = `<p class="empty">${filter === "todo" ? "남은 항목이 없어요. 전부 봤어요!" : "아직 체크한 항목이 없어요."}</p>`;

  el.innerHTML = `
    <div class="d-head">
      <div><h2>${esc(g.name)}</h2><div class="d-file">${esc(g.file)} · 수정 ${esc(g.updated)}</div></div>
      <dl class="d-stats">
        <div><dt>진행도</dt><dd class="acc">${g.pct}%</dd></div>
        <div><dt>감상</dt><dd>${hours(g.done)}</dd></div>
        <div><dt>남음</dt><dd>${hours(g.total - g.done)}</dd></div>
        <div><dt>항목</dt><dd class="num" style="font-family:var(--display)">${cnt}/${g.items.length}</dd></div>
      </dl>
    </div>
    <div class="strip-box">
      <div class="strip" aria-label="감상 순서대로 본 분량 (칸 너비 = 러닝타임)">${segs}</div>
      <div class="strip-legend">
        <span>감상 순서 → · 칸 너비는 러닝타임</span>
        <span><span><i class="sw done"></i>감상함</span> <span><i class="sw next"></i>다음 차례</span> <span><i class="sw"></i>안 봄</span></span>
      </div>
    </div>
    <div class="controls">
      <div class="chips" role="group" aria-label="목록 필터">
        ${[["all","전체"],["todo","남은 것"],["done","본 것"]].map(([k, l]) =>
          `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join("")}
      </div>
      ${g.notes.length ? `<details class="src"><summary>노트 메모 보기</summary><ul>${g.notes.map(t => `<li>${linkify(t)}</li>`).join("")}</ul></details>` : ""}
    </div>
    <div class="list">${list}</div>`;
}

function renderBacklog(){
  const b = DATA.backlog;
  if (!b.length){ $("#backlog").hidden = true; return; }
  const left = b.filter(x => !x.done).length;
  $("#backlog").innerHTML = `<h2>할 게임 백로그 <span class="num" style="font-size:15px;color:var(--muted)">${left}개 남음</span></h2>
    <ul class="bl">${b.map(x => `<li class="${x.done ? "done" : ""}"><span class="dot"></span>${esc(x.title)}</li>`).join("")}</ul>`;
}

function select(id){
  current = id;
  store.set("sl-game", id);
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  renderCards();
  renderDetail();
}

$("#games").addEventListener("click", e => {
  const b = e.target.closest(".game");
  if (b) select(b.dataset.id);
});
$("#games").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const i = games.findIndex(g => g.id === current);
  const d = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
  const next = games[(i + d + games.length) % games.length];
  select(next.id);
  $(`.game[data-id="${CSS.escape(next.id)}"]`).focus();
  e.preventDefault();
});
$("#detail").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip){
    filter = chip.dataset.f;
    store.set("sl-filter", filter);
    renderDetail();
    return;
  }
  const seg = e.target.closest(".seg");
  if (seg){
    let row = document.getElementById("item-" + seg.dataset.i);
    if (!row){ filter = "all"; store.set("sl-filter", filter); renderDetail(); row = document.getElementById("item-" + seg.dataset.i); }
    row.scrollIntoView({behavior: "smooth", block: "center"});
    row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
  }
});

renderSummary();
renderCards();
renderDetail();
renderBacklog();
$("#foot").textContent = `옵시디언 노트에서 ${DATA.built}에 생성`;
</script>
</body>
</html>
